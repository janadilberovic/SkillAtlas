<div class="screen">
  <header class="topbar">
    <span class="brand">SkillAtlas</span>
    <nav class="nav">
      <a routerLink="/finder" routerLinkActive="active">Expert finder</a>
      <a routerLink="/graph" routerLinkActive="active">Graph</a>
      @if (auth.isAdmin()) {
        <a routerLink="/people" routerLinkActive="active">People</a>
      }
      @if (auth.isAdmin()) {
        <a routerLink="/skills" routerLinkActive="active">Skills</a>
      }
      <a routerLink="/projects" routerLinkActive="active">Projects</a>
      @if (auth.isAdmin()) {
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      }
      <a routerLink="/me" routerLinkActive="active">My skills</a>
    </nav>

    @if (auth.isAdmin()) {
      <!-- The picker itself lives on the People screen; this is the shortcut to it. -->
      <a class="btn btn-sm" routerLink="/people" [queryParams]="{ import: 1 }">Import from VacaYAY</a>
    }

    <div class="user">
      <sa-avatar [initials]="auth.user()?.initials ?? ''" [src]="auth.user()?.avatarUrl ?? null" />
      <div class="who">
        <span class="name">{{ shortName() }}</span>
        <span class="role">{{ auth.user()?.role }}</span>
      </div>
      <button class="signout" title="Sign out" (click)="logout()">Sign out</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
