# Render Blueprint: jedan web servis iz Dockerfile-a (Angular + API u istom jaru),
# baza je Neo4j Aura Free izvan Rendera.
# Vrijednosti sa `sync: false` Render trazi u dashboardu pri prvom kreiranju — nikad u repo.
services:
  - type: web
    name: skillatlas
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    # Jedini permitAll endpoint osim logina, pa health check ne treba token.
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Free instanca ima 512 MB ukupno. Bez ovoga JVM racuna svoju cetvrtinu napamet i
      # ostavlja premalo za ostatak procesa.
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx320m
      - key: NEO4J_DATABASE
        value: neo4j
      # Prazno je ispravno: Angular se servira iz istog jara, pa cross-origin poziva nema.
      - key: SECURITY_CORS_ALLOWED_ORIGINS
        value: ""
      # Namjerno NIJE generateValue: HMAC-SHA256 trazi >= 32 bajta, a duzina generisane
      # vrijednosti nije zagarantovana. Zalijepi onu iz .env.aura.
      - key: JWT_SECRET
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
