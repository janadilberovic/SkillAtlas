# Neo4j lokalno jednom komandom:  docker compose up -d
# Alternativa Neo4j Desktop-u. Ako koristiš Desktop, ovaj fajl ti ne treba —
# samo podesi .env da gađa Desktop instancu.
services:
  neo4j:
    # Pinned: CI runs the same tag, so "green locally, red in CI" can't come from a silent bump.
    image: neo4j:5.26-community
    container_name: skillatlas-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (http://localhost:7474)
      - "7687:7687"   # Bolt (driver se konektuje ovde)
    environment:
      # format: NEO4J_AUTH=neo4j/<password>
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-please-change-me}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  azurite:
    # Pinned for the same reason as neo4j above: CI and local must see the same emulator.
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: skillatlas-azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"   # Blob endpoint (profilne slike)
    volumes:
      - azurite-data:/data

volumes:
  neo4j-data:
  neo4j-logs:
  azurite-data:
