# Aktivira se sa SPRING_PROFILES_ACTIVE=prod. Postoji da bi produkcija PALA na startu umjesto da
# tiho radi sa dev defaultima iz application.yml — bez ":" nema rezervne vrijednosti.
spring:
  neo4j:
    authentication:
      password: ${NEO4J_PASSWORD}

security:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    # Prazno je ispravno kad frontend i API dijele origin (Angular je u jaru).
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}

skillatlas:
  # Ovdje, a ne u .env: zaboravljena env varijabla ne smije proizvesti demo podatke u produkciji.
  seed:
    enabled: false

management:
  endpoint:
    health:
      # /actuator/health je permitAll, a "always" bi anonimnom pozivaocu pokazao Neo4j konekciju.
      show-details: never
