spring:
  application:
    name: skillatlas

  # --- Neo4j konekcija ---
  # Vrednosti dolaze iz env varijabli (secrets NIKAD u repo).
  # Za lokalni razvoj koristi .env / Neo4j Desktop (default bolt port je 7687).
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:please-change-me}

  data:
    neo4j:
      database: ${NEO4J_DATABASE:neo4j}

  # Prva odbrana od velikog uploada: Tomcat prekida prije nego kontroler vidi ijedan bajt.
  # max-request-size je namerno veći — multipart okvir i boundary nisu besplatni.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  # PORT je fallback za PaaS koji sam dodjeljuje port (Render); SERVER_PORT i dalje ima prednost.
  port: ${SERVER_PORT:${PORT:8080}}

# JWT signing (HMAC). Secret from env; dev default is not for production.
security:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-only-secret-please-rotate-0123456789}
    expiration-minutes: ${JWT_EXP_MINUTES:120}

# Azure Blob Storage za profilne slike. Lokalno: Azurite iz docker-compose.
# UseDevelopmentStorage=true je zvanicna SDK skracenica za Azurite na 127.0.0.1:10000.
azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true}
    container: ${AZURE_AVATAR_CONTAINER:avatars}
    sas-minutes: ${AZURE_AVATAR_SAS_MINUTES:15}

# Stari sistem (E3). Kredencijali servisnog HR naloga NIKAD u repo — .env, kao i Neo4j.
# page-size 100 je plafon koji VacaYAY-ev validator dozvoljava; max-pages je zaštita od beskonačne vrtnje.
vacayay:
  base-url: ${VACAYAY_BASE_URL:http://localhost:5266}
  email: ${VACAYAY_USER:}
  password: ${VACAYAY_PASSWORD:}
  page-size: ${VACAYAY_PAGE_SIZE:100}
  max-pages: ${VACAYAY_MAX_PAGES:20}
  connect-timeout-seconds: ${VACAYAY_CONNECT_TIMEOUT:3}
  read-timeout-seconds: ${VACAYAY_READ_TIMEOUT:10}

# Actuator: /actuator/health pokazuje i status Neo4j konekcije
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.data.neo4j: INFO
    # Uključi da vidiš generisani Cypher tokom razvoja:
    # org.springframework.data.neo4j.cypher: DEBUG
